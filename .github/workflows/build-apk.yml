# Compila el APK debug con los temas (Fase 06.11) y publica un release.
# Se ejecuta automáticamente con cada push a main.
# Los archivos binarios (modelo 3D, iconos, gradle-wrapper.jar) van en
# assets-bin/ codificados en base64 y se restauran antes de compilar.
name: Build debug APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Restore binary assets
        run: |
          find assets-bin -name '*.b64' | while read f; do
            dest="${f#assets-bin/}"
            dest="${dest%.b64}"
            mkdir -p "$(dirname "$dest")"
            base64 -d "$f" > "$dest"
          done
          ls -lh app/src/main/assets/models/chevy_c2_2009.glb
          ls app/src/main/res/mipmap-hdpi/

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Nota: NO usamos android-actions/setup-android: su versión actual
      # intenta instalar el paquete obsoleto "tools" y el paso falla.
      # La imagen ubuntu-latest ya trae el Android SDK preinstalado.
      - name: Install SDK packages
        run: |
          if command -v sdkmanager >/dev/null; then SDKMANAGER=sdkmanager; else SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"; fi
          echo "installed platforms:"; ls "$ANDROID_HOME/platforms" 2>/dev/null || true
          yes | "$SDKMANAGER" --licenses
          "$SDKMANAGER" "platforms;android-36" "platforms;android-35" "build-tools;35.0.0"
          # android-37 is not published in any sdkmanager channel yet
          # (stable, canary and dev all report "Failed to find package").
          # The project declares compileSdk 37 and its AAR metadata check
          # compares declared versions, so provide the platform folder
          # with the android-36 files: if the code used API 37-only symbols
          # the build fails loudly here instead of silently miscompiling.
          if [ ! -d "$ANDROID_HOME/platforms/android-37" ]; then
            "$SDKMANAGER" "platforms;android-37" || "$SDKMANAGER" --channel=3 "platforms;android-37" || "$SDKMANAGER" --channel=2 "platforms;android-37" || echo "android-37 not available via sdkmanager, using android-36 files"
          fi
          if [ ! -d "$ANDROID_HOME/platforms/android-37" ]; then
            cp -r "$ANDROID_HOME/platforms/android-36" "$ANDROID_HOME/platforms/android-37"
            ls "$ANDROID_HOME/platforms/android-37" | head
          fi

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --stacktrace

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: DivineDeck-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish release with the APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: debug-06.11-${{ github.run_number }}
          name: DivineDeck 06.11 debug (build ${{ github.run_number }})
          body: |
            APK debug de DivineDeck con los 10 temas (5 clásicos + 5 Panorámico:
            Minimalista por defecto, Rojo Sport, Espectro, Vaporwave, Ácido Lima)
            y la corrección de M2 (letras offline).
            Compilado con compileSdk 37 (igual que los módulos bitchord).
          files: app/build/outputs/apk/debug/app-debug.apk
